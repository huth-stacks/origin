name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Install Clarinet
        env:
          CLARINET_VERSION: v3.23.1
        run: |
          install -d "${RUNNER_TEMP}/clarinet-install"
          cd "${RUNNER_TEMP}/clarinet-install"
          curl --fail --location --silent --show-error \
            "https://github.com/stx-labs/clarinet/releases/download/${CLARINET_VERSION}/clarinet-linux-x64-glibc.tar.gz" \
            --output clarinet-linux-x64-glibc.tar.gz
          curl --fail --location --silent --show-error \
            "https://github.com/stx-labs/clarinet/releases/download/${CLARINET_VERSION}/checksums.txt" \
            --output clarinet-checksums.txt
          grep 'clarinet-linux-x64-glibc.tar.gz' clarinet-checksums.txt | sha256sum --check --strict
          tar --extract --gzip --file clarinet-linux-x64-glibc.tar.gz
          sudo install --mode 0755 clarinet /usr/local/bin/clarinet
          clarinet --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify
